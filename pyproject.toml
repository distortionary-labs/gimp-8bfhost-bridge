[project]
name = "gimp-8bfhost-bridge"
version = "0.1.0"
description = "Run Photoshop-compatible filter plug-ins (.8bf) in GIMP 3 through 8bf-host"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# GIMP 3 provides PyGObject and its own bindings; 8bf-host is installed separately.
dependencies = []

[project.urls]
Repository = "https://github.com/distortionary-labs/gimp-8bfhost-bridge"
Homepage = "https://distortionary.com"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["external", "ref"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# B905 (zip strict=) needs Python 3.10.
ignore = ["E731", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["gimp_8bfhost_bridge", "conftest", "fixture_pipl"]
